name: Set up SDL3
description: >-
  Restore the pinned SDL3 from the Actions cache, building it from source only
  on a miss, and export its install prefix for CMAKE_PREFIX_PATH.

# Why this exists rather than a call to libsdl-org/setup-sdl:
#
# setup-sdl caches the SDL build correctly, but its install-linux-dependencies
# option runs unconditionally, before it knows whether the cache hit. On the
# Linux legs that means an apt-get of dozens of dev packages on every run to
# satisfy a source build that never happened, against a game build of a few
# seconds. Ownership of the cache is what makes the dependency install
# conditional, and owning the cache means owning the build.
#
# Two other things fall out of it. The cache key carries runner.arch, so the
# x86_64 and aarch64 legs stop colliding (setup-sdl keys on platform only).
# And on a hit nothing outside GitHub is contacted at all, so an upstream
# outage can only affect the run that deliberately bumps the pin, which lives
# in .github/sdl3-version.txt.
#
# Shared linking only: the Windows and macOS release zips bundle this
# runtime next to the binary, and one build type keeps the cache key and
# the recipe below free of a branch nothing exercises.

inputs:
  build-type:
    description: CMake build type for SDL3 itself (not for our code).
    required: false
    default: Release

outputs:
  prefix:
    description: Root of the SDL3 install. Pass to CMAKE_PREFIX_PATH.
    value: ${{ steps.plan.outputs.prefix }}
  version:
    description: The pinned SDL3 tag that was restored or built.
    value: ${{ steps.plan.outputs.version }}

runs:
  using: composite
  steps:
    # RUNNER_TEMP rather than a workspace path: SDL3Config.cmake bakes absolute
    # paths at install time, and the cache is restored to whatever path it was
    # saved from. RUNNER_TEMP is fixed on hosted runners, the workspace is not
    # guaranteed to be.
    - name: Resolve the pin
      id: plan
      shell: bash
      # Inputs arrive through the environment rather than interpolated into
      # the script body, so a value can never terminate a quote and become
      # shell.
      env:
        BUILD_TYPE: ${{ inputs.build-type }}
        OS: ${{ runner.os }}
        ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail
        # This script runs in Git Bash on the Windows legs, where both
        # variables arrive as D:\a\_temp style paths. Two forms are needed:
        # a POSIX one for this shell's own redirections and `git -C` (the
        # shell does not convert backslash paths inside `< file`), and a
        # forward-slash Windows one for cmake, git clone and the cache
        # action, which do not understand /d/a/... either.
        ws="${GITHUB_WORKSPACE}"
        temp="${RUNNER_TEMP}"
        if command -v cygpath >/dev/null 2>&1; then
          ws="$(cygpath -u "${GITHUB_WORKSPACE}")"
          temp="$(cygpath -m "${RUNNER_TEMP}")"
        fi
        version="$(tr -d '[:space:]' < "${ws}/.github/sdl3-version.txt")"
        if [ -z "${version}" ]; then
          echo "setup-sdl3: .github/sdl3-version.txt is empty" >&2
          exit 1
        fi
        # The key covers the recipe as well as the tag. Without the recipe
        # hash, editing the cmake flags below restores a prefix built with the
        # old ones and every leg goes green against an SDL3 that no longer
        # matches the tree.
        recipe="$(git -C "${ws}" hash-object .github/actions/setup-sdl3/action.yml)"
        {
          echo "version=${version}"
          echo "prefix=${temp}/sdl3"
          echo "src=${temp}/sdl3-src"
          echo "build=${temp}/sdl3-build"
          echo "key=sdl3-${version}-${OS}-${ARCH}-${BUILD_TYPE}-${recipe:0:12}"
        } >> "$GITHUB_OUTPUT"

    - name: Restore SDL3 from the cache
      id: restore
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.plan.outputs.prefix }}
        key: ${{ steps.plan.outputs.key }}

    # Needed to build SDL, so on a hit the whole apt leg disappears.
    - name: Install SDL3 build dependencies
      if: runner.os == 'Linux' && steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        # The failure mode here is a stalled mirror, not a failed fetch.
        # Acquire::Retries only re-tries a request that came back with an
        # error; a hung connection just sits, and apt has no default wall
        # clock. Observed on the upstream project this was written for:
        # azure.archive.ubuntu.com Ign'd every line, apt fell back to
        # archive.ubuntu.com, and `update` then went silent for 29 minutes
        # until the 30-minute job timeout cancelled the leg.
        #
        # So bound both ends: per-connection timeouts, and a wall clock on
        # each phase, retried. A bad mirror now costs a retry rather than the
        # job, and a mirror that is down for good fails the leg in about 17
        # minutes with a named cause instead of going quiet until the job
        # timeout.
        apt_opts=(
          -o Acquire::Retries=5
          -o Acquire::http::Timeout=15
          -o Acquire::https::Timeout=15
        )
        # Curated rather than SDL's own suggested set: these are the backends
        # the shipped build actually uses, so CI and a desktop build agree on
        # one SDL3.
        for attempt in 1 2 3; do
          # Killing apt mid-transaction leaves dpkg interrupted, and every
          # later attempt then aborts with "dpkg was interrupted" before it
          # fetches anything. Without this the wall clock converts a stall
          # into a hard failure rather than into the retry it is there for.
          sudo dpkg --configure -a || true
          if timeout -k 30 90 sudo apt-get "${apt_opts[@]}" update \
            && timeout -k 30 240 sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends \
              libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
              libxinerama-dev libxxf86vm-dev libxss-dev libxtst-dev \
              libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev \
              libasound2-dev libpulse-dev \
              libudev-dev libdbus-1-dev; then
            exit 0
          fi
          if [ "${attempt}" = 3 ]; then
            echo "apt failed after 3 attempts" >&2
            exit 1
          fi
          echo "apt attempt ${attempt} failed or timed out; retrying in 10s"
          sleep 10
        done

    - name: Build SDL3
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        SDL3_VERSION: ${{ steps.plan.outputs.version }}
        SDL3_SRC: ${{ steps.plan.outputs.src }}
        SDL3_BUILD: ${{ steps.plan.outputs.build }}
        SDL3_PREFIX: ${{ steps.plan.outputs.prefix }}
        SDL3_BUILD_TYPE: ${{ inputs.build-type }}
      run: |
        set -euo pipefail
        # Bounded as well as retried: a stalled clone returns no error for
        # the retry count to see, and would sit here until the job timeout
        # cancelled the leg with nothing in the log.
        #
        # `timeout` is GNU coreutils. It is always there on the Linux
        # runners, but macOS ships no such command (Homebrew's coreutils
        # installs it g-prefixed), and an unguarded call would exit 127 on
        # every attempt and report a clone failure that never happened. So
        # bound the clone where the tool exists and run it plain where it
        # does not; the retry loop still covers the error shape on both.
        if command -v timeout >/dev/null 2>&1; then
          bounded_clone() { timeout -k 30 300 git clone "$@"; }
        else
          echo "note: no timeout(1) on this runner, cloning unbounded"
          bounded_clone() { git clone "$@"; }
        fi
        rm -rf "${SDL3_SRC}"
        for i in 1 2 3; do
          bounded_clone --depth 1 --branch "${SDL3_VERSION}" \
            https://github.com/libsdl-org/SDL.git "${SDL3_SRC}" && break
          echo "SDL3 clone attempt ${i} failed, retrying..."
          rm -rf "${SDL3_SRC}"
          sleep 5
        done
        test -d "${SDL3_SRC}"

        # Ninja, matching how SDL3 is built everywhere else (the Android leg,
        # a local build). Both hosted runner images ship it, and the repo's
        # setup-ninja action puts it on PATH before this step runs.
        cmake -S "${SDL3_SRC}" -B "${SDL3_BUILD}" -G Ninja \
          -DCMAKE_BUILD_TYPE="${SDL3_BUILD_TYPE}" \
          -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
          -DSDL_STATIC=OFF -DSDL_SHARED=ON
        cmake --build "${SDL3_BUILD}" --parallel
        cmake --install "${SDL3_BUILD}" --prefix "${SDL3_PREFIX}"

    # Explicit save rather than actions/cache's post step, so a hit never
    # re-uploads what it just restored.
    #
    # The legs of this workflow share one key, so a pin bump has all of them
    # missing and building concurrently and all but one save losing the race.
    # actions/cache/save treats an already-reserved key as a warning, not a
    # failure, so this is wasted work on the bump run only and never a red
    # leg.
    - name: Save SDL3 to the cache
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.plan.outputs.prefix }}
        key: ${{ steps.plan.outputs.key }}
