name: Set up SDL3 (Android)
description: >-
  Resolve a pinned Android NDK, then restore the pinned SDL3 built for one ABI
  from the Actions cache, building it from source only on a miss. Exports the
  NDK root, the SDL3 install prefix, and the source checkout path.

# Android is the one leg whose SDL3 cannot share the desktop cache: it is a
# cross-build against a different libc (Bionic) and a different clang, per
# ABI, so its key carries the ABI and this file's own hash. Ownership of the
# cache is what makes the NDK install and the source build conditional -- the
# same reason .github/actions/setup-sdl3 exists rather than a call to
# libsdl-org/setup-sdl.
#
# The key hashes this whole file because almost everything that changes the
# output lives here: ANDROID_PLATFORM, ANDROID_STL, the 16 KB page-size
# linker flags, and the NDK version default. A hand-written list would be a
# second thing to keep in sync, and forgetting to extend it would restore a
# stale SDL3. The key also names the NDK version and the ABI outright, so a
# caller overriding the default NDK, or the second ABI leg, cannot be handed
# a cache built against something else. The SDL tag lives in
# .github/sdl3-version.txt, hashed alongside.
#
# Linux runners only: this action drives the NDK toolchain, which has no
# Windows or macOS host story in this repo.

inputs:
  abi:
    description: Android ABI to build SDL3 for (arm64-v8a, armeabi-v7a, ...).
    required: true
  ndk-version:
    description: Android NDK version, as the sdkmanager package revision.
    required: false
    default: 28.2.13676358
  api-level:
    description: Minimum Android API level (ANDROID_PLATFORM).
    required: false
    default: "24"

outputs:
  prefix:
    description: >-
      Root of the SDL3 install. Not a find_package search path here (see
      sdl3-dir); it is what the cache saves and what the locate step reads.
    value: ${{ steps.plan.outputs.prefix }}
  ndk:
    description: Root of the resolved Android NDK.
    value: ${{ steps.ndk.outputs.ndk }}
  version:
    description: The pinned SDL3 tag that was restored or built.
    value: ${{ steps.plan.outputs.version }}
  api-level:
    description: The ANDROID_PLATFORM SDL3 was built for; match it for the game.
    value: ${{ steps.plan.outputs.api-level }}
  sdl3-dir:
    description: >-
      Directory of SDL3Config.cmake. Pass to SDL3_DIR rather than
      CMAKE_PREFIX_PATH; see the locate step below.
    value: ${{ steps.pkg.outputs.dir }}
  src:
    description: >-
      Where this run cloned the SDL3 source. The cache covers the install
      prefix only, so on a hit the directory does not exist; a caller that
      needs the source tree (android-project/, the Java side, which
      cmake --install never copies) has to clone the pin there itself.
    value: ${{ steps.plan.outputs.src }}

runs:
  using: composite
  steps:
    - name: Resolve the pin
      id: plan
      shell: bash
      # Inputs arrive through the environment rather than interpolated into
      # the script body, so a value can never terminate a quote and become
      # shell.
      env:
        ABI: ${{ inputs.abi }}
        API_LEVEL: ${{ inputs.api-level }}
        NDK_VERSION: ${{ inputs.ndk-version }}
      run: |
        set -euo pipefail
        # RUNNER_TEMP rather than a workspace path: SDL3Config.cmake bakes
        # absolute paths at install time, and the cache is restored to
        # whatever path it was saved from. RUNNER_TEMP is fixed on hosted
        # runners; the workspace is not guaranteed to be.
        version="$(tr -d '[:space:]' < "${GITHUB_WORKSPACE}/.github/sdl3-version.txt")"
        if [ -z "${version}" ]; then
          echo "setup-sdl3-android: .github/sdl3-version.txt is empty" >&2
          exit 1
        fi
        case "${ABI}" in
          arm64-v8a|armeabi-v7a|x86|x86_64) ;;
          *) echo "setup-sdl3-android: unexpected ABI '${ABI}'" >&2; exit 1 ;;
        esac
        recipe="$(git -C "${GITHUB_WORKSPACE}" hash-object .github/actions/setup-sdl3-android/action.yml)"
        {
          echo "version=${version}"
          echo "api-level=${API_LEVEL}"
          echo "prefix=${RUNNER_TEMP}/sdl3-android"
          echo "src=${RUNNER_TEMP}/sdl3-android-src"
          echo "build=${RUNNER_TEMP}/sdl3-android-build"
          echo "key=sdl3-android-${version}-${ABI}-api${API_LEVEL}-ndk${NDK_VERSION}-${recipe:0:12}"
        } >> "$GITHUB_OUTPUT"

    # A wrong NDK version would be invisible to a cache keyed only on the
    # file hash -- which is why the key names it as well -- so resolve the
    # exact pin, install it if the runner image does not carry it, and fail
    # loudly rather than falling back to whatever NDK happens to be
    # installed.
    - name: Resolve Android NDK
      id: ndk
      shell: bash
      env:
        NDK_VERSION: ${{ inputs.ndk-version }}
      run: |
        set -euo pipefail
        SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        ndk="${SDK}/ndk/${NDK_VERSION}"
        if [ ! -f "${ndk}/build/cmake/android.toolchain.cmake" ]; then
          # The hosted images carry an SDK and usually an sdkmanager, but the
          # command is not guaranteed to be on PATH and an image prune can
          # drop the pinned NDK. Fetch the command-line tools when there is
          # none; both fetches are bounded and retried, because a stalled
          # endpoint returns no error for a retry count to see and would sit
          # here until the job timeout cancelled the leg with nothing in the
          # log.
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "${sdkmanager}" ]; then
            for cand in \
              "${SDK}/cmdline-tools/latest/bin/sdkmanager" \
              "${SDK}/tools/bin/sdkmanager"; do
              if [ -x "${cand}" ]; then sdkmanager="${cand}"; break; fi
            done
          fi
          if [ -z "${sdkmanager}" ]; then
            echo "No sdkmanager found under ${SDK}; installing the command-line tools"
            mkdir -p "${SDK}/cmdline-tools"
            for attempt in 1 2 3; do
              if timeout -k 30 300 curl -fLSs --retry 3 --connect-timeout 15 \
                  -o "${RUNNER_TEMP}/cmdline-tools.zip" \
                  "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"; then
                break
              fi
              if [ "${attempt}" = 3 ]; then
                echo "command-line tools download failed after 3 attempts" >&2
                exit 1
              fi
              echo "command-line tools download attempt ${attempt} failed; retrying in 10s"
              sleep 10
            done
            unzip -qo "${RUNNER_TEMP}/cmdline-tools.zip" -d "${RUNNER_TEMP}/cmdline-tools-unzip"
            rm -rf "${SDK}/cmdline-tools/latest"
            mkdir -p "${SDK}/cmdline-tools/latest"
            mv "${RUNNER_TEMP}/cmdline-tools-unzip/cmdline-tools/"* "${SDK}/cmdline-tools/latest/"
            rm -rf "${RUNNER_TEMP}/cmdline-tools.zip" "${RUNNER_TEMP}/cmdline-tools-unzip"
            sdkmanager="${SDK}/cmdline-tools/latest/bin/sdkmanager"
            echo "${SDK}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          fi
          yes | "${sdkmanager}" --licenses > /dev/null 2>&1 || true
          for attempt in 1 2 3; do
            if timeout -k 30 600 "${sdkmanager}" --install "ndk;${NDK_VERSION}" > /dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" = 3 ]; then
              echo "installing ndk;${NDK_VERSION} failed after 3 attempts" >&2
              exit 1
            fi
            echo "ndk install attempt ${attempt} failed; retrying in 10s"
            sleep 10
          done
        fi
        if [ ! -f "${ndk}/build/cmake/android.toolchain.cmake" ]; then
          echo "NDK ${NDK_VERSION} is not usable at ${ndk}" >&2
          exit 1
        fi
        echo "ndk=${ndk}" >> "${GITHUB_OUTPUT}"
        echo "Using NDK ${NDK_VERSION} at ${ndk}"

    - name: Restore SDL3 from the cache
      id: restore
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.plan.outputs.prefix }}
        key: ${{ steps.plan.outputs.key }}

    # NDK toolchain + per-ABI build, exactly the recipe the cache key hashes.
    # The 16 KB page-size flags are what Android 15+ requires of every
    # loadable ELF; they cost nothing at compile time and keep a future APK
    # leg from inheriting an unaligned library.
    - name: Build SDL3
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        SDL3_VERSION: ${{ steps.plan.outputs.version }}
        SDL3_SRC: ${{ steps.plan.outputs.src }}
        SDL3_BUILD: ${{ steps.plan.outputs.build }}
        SDL3_PREFIX: ${{ steps.plan.outputs.prefix }}
        ABI: ${{ inputs.abi }}
        API_LEVEL: ${{ inputs.api-level }}
        NDK: ${{ steps.ndk.outputs.ndk }}
      run: |
        set -euo pipefail
        # Bounded as well as retried: a stalled clone returns no error for
        # the retry count to see, and would sit here until the job timeout
        # cancelled the leg with nothing in the log.
        rm -rf "${SDL3_SRC}"
        for attempt in 1 2 3; do
          if timeout -k 30 300 git clone --depth 1 --branch "${SDL3_VERSION}" \
              https://github.com/libsdl-org/SDL.git "${SDL3_SRC}"; then
            break
          fi
          echo "SDL3 clone attempt ${attempt} failed, retrying..."
          rm -rf "${SDL3_SRC}"
          sleep 5
        done
        # Without this the loop falls through on three failures and the next
        # cmake reports a missing source dir instead of a bad clone.
        test -d "${SDL3_SRC}"

        cmake -S "${SDL3_SRC}" -B "${SDL3_BUILD}" -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="${NDK}/build/cmake/android.toolchain.cmake" \
          -DANDROID_ABI="${ABI}" \
          -DANDROID_PLATFORM="${API_LEVEL}" \
          -DANDROID_STL=c++_shared \
          -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
          -DSDL_STATIC=OFF -DSDL_SHARED=ON \
          -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
        cmake --build "${SDL3_BUILD}" --parallel
        cmake --install "${SDL3_BUILD}" --prefix "${SDL3_PREFIX}"

    # find_package in a cross build only searches CMAKE_FIND_ROOT_PATH: the
    # NDK toolchain sets CMAKE_FIND_ROOT_PATH_MODE_PACKAGE to ONLY, so a
    # CMAKE_PREFIX_PATH entry pointing outside it is silently ignored and
    # SDL3 comes back "not found" even though it is installed (which is why
    # the desktop legs, with no toolchain file, can use the prefix and this
    # one cannot). An explicit SDL3_DIR is taken as-is, so hand the caller
    # the directory instead of the prefix. Resolved here rather than assumed
    # to be <prefix>/lib/cmake/SDL3 so a change in where SDL installs its
    # config files cannot turn into a leg that finds nothing.
    - name: Locate the SDL3 CMake package
      id: pkg
      shell: bash
      env:
        SDL3_PREFIX: ${{ steps.plan.outputs.prefix }}
      run: |
        set -euo pipefail
        cfg="$(find "${SDL3_PREFIX}" -name SDL3Config.cmake -print -quit)"
        if [ -z "${cfg}" ]; then
          echo "setup-sdl3-android: no SDL3Config.cmake under ${SDL3_PREFIX}" >&2
          exit 1
        fi
        echo "dir=$(dirname "${cfg}")" >> "${GITHUB_OUTPUT}"

    # Explicit save rather than actions/cache's post step, so a hit never
    # re-uploads what it just restored. The two ABI legs carry different keys,
    # so they never race each other; a pin bump has both missing and both
    # saving, which is wasted work on that run only and never a red leg.
    - name: Save SDL3 to the cache
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.plan.outputs.prefix }}
        key: ${{ steps.plan.outputs.key }}
