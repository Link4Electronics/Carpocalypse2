name: CI

# Runs on PRs and manual dispatch only; pushes to main are covered by the
# reccmp-report workflow.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: "CI ${{ matrix.platform.name }}"
    runs-on: "${{ matrix.platform.os }}"
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {
              name: "MinGW",
              os: ubuntu-latest,
              werror: true,
              cmake-args: '-DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw32.cmake',
            }
          - {
              name: "MSVC",
              os: windows-latest,
              werror: true,
            }
          - {
              name: "MSVC5",
              os: windows-2025-vs2026,
              msvc5: true,
              # Matching build: original compiler, original flags.
              cmake-args: '-DCARPOCALYPSE2_MATCHING=TRUE -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl',
            }
    defaults:
      run:
        shell: sh
    steps:
      - name: Fetch carpocalypse2 sources
        uses: actions/checkout@v6

      # -- MSVC5 (Visual C++ 97 SP3): the original matching toolchain ------
      - name: Fetch MSVC5 (Visual C++ 97 SP3)
        if: ${{ !!matrix.platform.msvc5 }}
        uses: actions/checkout@v6
        with:
          repository: archaic-msvc/msvc500sp3
          path: msvc500

      - name: Setup MSVC5 (Visual C++ 97 SP3)
        if: ${{ !!matrix.platform.msvc5 }}
        shell: cmd
        run: |
          echo INCLUDE=%GITHUB_WORKSPACE%\msvc500\include;%GITHUB_WORKSPACE%\msvc500\atl\include;%GITHUB_WORKSPACE%\msvc500\mfc\include>>%GITHUB_ENV%
          echo LIB=%GITHUB_WORKSPACE%\msvc500\lib;%GITHUB_WORKSPACE%\msvc500\mfc\lib>>%GITHUB_ENV%
          echo %GITHUB_WORKSPACE%\msvc500\bin>>%GITHUB_PATH%
          echo %GITHUB_WORKSPACE%\msvc500\redist>>%GITHUB_PATH%

      # -- Toolchain plumbing ----------------------------------------------
      - name: Set up Ninja
        uses: ./.github/actions/setup-ninja

      - name: Setup modern MSVC (x86)
        if: ${{ matrix.platform.name == 'MSVC' }}
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x86

      - name: Install MinGW (i686 cross)
        if: ${{ matrix.platform.name == 'MinGW' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 g++-mingw-w64-i686

      - name: Set up Python (reccmp)
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      # -- Build -------------------------------------------------------------
      - name: Configure (CMake)
        run: |
          cmake -S . -B build -GNinja \
            ${{ matrix.platform.cmake-args }} \
            -DCARPOCALYPSE2_VENDORED=ON \
            -DCARPOCALYPSE2_WERROR=${{ (matrix.platform.werror && 'ON') || 'OFF' }}

      - name: Build (CMake)
        run: |
          cmake --build build

      # -- reccmp (MSVC5 leg only) -------------------------------------------
      - name: Install reccmp
        if: ${{ matrix.platform.msvc5 }}
        run: |
          python -m pip -q install reccmp

      - name: Download original binary
        if: ${{ matrix.platform.msvc5 }}
        run: |
          mkdir originals
          # Only the CARMA2_HW target is compared, which needs just
          # CARMA2_HW.EXE. Fetched from a public archive.org item; the sha256
          # must match reccmp-project.yml.
          curl -fLSs -o originals/CARMA2_HW.EXE \
            "https://archive.org/download/carma-2-hw/CARMA2_HW.EXE"
          echo "9b896c2cbb170c01b3e9f904ce5e1808db29fe5b51184a5d55a6d19b1799b58d  originals/CARMA2_HW.EXE" | sha256sum -c -

      - name: Detect originals
        if: ${{ matrix.platform.msvc5 }}
        run: |
          reccmp-project detect --what original --search-path originals

      - name: Run reccmp
        if: ${{ matrix.platform.msvc5 }}
        working-directory: build
        shell: sh
        run: |
          reccmp-reccmp --no-color --target CARMA2_HW \
            --json reccmp-report.json --json-diet \
            -T 5162 \
            -S reccmp-progress.svg
